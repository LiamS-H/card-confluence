[package]
name = "card-confluence-wasm-browser"
version = "0.1.0"
edition = "2021"

[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-O",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
    "--enable-sign-ext",
]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
arrow = { workspace = true }
arrow-ipc = { workspace = true }
parquet = { workspace = true, default-features = false, features = ["arrow"] }
arrow-schema = { workspace = true }
arrow-array = { workspace = true }
datafusion = { workspace = true, default-features = false, features = [
    "parquet",
    "regex_expressions",
] }
datafusion-proto = { workspace = true }
arrow_convert = { workspace = true }
url = { workspace = true }
object_store = { workspace = true }

scryfall-rust-bindings = { path = "../scryfall_rust_bindings" }
card-confluence-db = { path = "../card_confluence_db" }

async-trait = { workspace = true }
async-stream = "0.3"
futures = { workspace = true }
chrono = { workspace = true, features = ["wasmbind"] }

reqwest = { version = "0.13", features = ["json"] }
tokio = { workspace = true }

serde_json = { workspace = true }


serde = { workspace = true, features = ["derive"] }
serde_bytes = "0.11"
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
tsify = { workspace = true }

bytes = "1.5"
web-sys = { version = "0.3", features = [
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemSyncAccessHandle",
    "FileSystemReadWriteOptions",
    "FileSystemWritableFileStream",
    "Window",
    "Navigator",
    "StorageManager",
    "File",
    "Blob",
    "console",
] }
js-sys = "0.3"
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
