[package]
name = "card_confluence_db"
version = "0.1.0"
edition = "2021"

[dependencies]
# we use arrow 57 as the latest version compatible with arrow_convert
arrow = "57"
parquet = "57"
arrow-schema = "57"
arrow-array = "57"
arrow_convert = "0.11.4"

scryfall-rust-bindings = { path = "../scryfall-rust-bindings" }
indicatif = "0.17.11"
futures = "0.3.31"
serde_json = "1.0.149"
chrono = "0.4.40"
reqwest = { version = "0.13.2", features = ["json"] }

tokio = { workspace = true }

serde = { workspace = true, features = ["derive"] }
wasm-bindgen = { workspace = true }
tsify = { workspace = true }
